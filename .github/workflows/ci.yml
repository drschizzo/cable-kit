name: CI

# Run by hand (Actions tab → CI → Run workflow). To run it on every push, add under "on:":
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  check:
    name: Lint, types, tests, packages, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Packages (dist, and what their tarballs hold)
        run: npm run pack
      - run: npm run build:examples
