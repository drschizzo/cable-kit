    <link rel="stylesheet" href="../style.css" />
    <style>
      #info { display: flex; flex-direction: column; gap: 6px; max-width: 640px; }

      #stats { position: absolute; left: 12px; bottom: 10px; right: 12px; color: #9aa5b1; pointer-events: none; }
      .label { color: #e7ebef; background: rgba(16, 18, 20, 0.7); padding: 2px 8px; border-radius: 4px; text-align: center; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="info">
      <div><a href="../index.html">cable-kit</a> · knots, a capstan, a braid: ropes pressing hard on one another</div>

      <div id="actions"><select id="knot"></select></div>

    </div>
    <div id="stats"></div>
